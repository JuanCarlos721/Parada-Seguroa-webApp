services:
  webapp:
    build:
      context: .
      target: dev
    container_name: parada-segura-webapp
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: unless-stopped

  webapp-prod:
    build:
      context: .
      target: prod
    container_name: parada-segura-webapp-prod
    profiles:
      - prod
    ports:
      - "8080:80"
    restart: unless-stopped
